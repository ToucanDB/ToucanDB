[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toucandb"
version = "2.0.0"
description = "ToucanDB - ML-first vector database for AI applications, LLM integration, and semantic search of unstructured data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    {name = "Pierre-Henry Soria", email = "pierre@ph7.me"}
]
maintainers = [
    {name = "Pierre-Henry Soria", email = "pierre@ph7.me"}
]
keywords = [
    "vector-database", "ml", "ai", "machine-learning", "embeddings", 
    "similarity-search", "faiss", "vector-search", "database", "async",
    "rag", "llm", "semantic-search", "unstructured-data", "artificial-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0,<3.0.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "msgpack>=1.0.0",
    "lz4>=4.0.0",
    "faiss-cpu>=1.12.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/ToucanDB/ToucanDB"
Documentation = "https://github.com/ToucanDB/ToucanDB#readme"
Repository = "https://github.com/ToucanDB/ToucanDB.git"
Issues = "https://github.com/ToucanDB/ToucanDB/issues"
Changelog = "https://github.com/ToucanDB/ToucanDB/blob/main/CHANGELOG.md"
"Author Website" = "https://pierrehenry.dev"
"Author GitHub" = "https://github.com/pH-7"
"Author LinkedIn" = "https://www.linkedin.com/in/ph7enry/"

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0.0",
    "twine>=6.0.0",
]
embeddings = [
    "sentence-transformers>=5.0.0,<6.0.0",
]
# Compatibility alias retained for 1.x installation instructions.
ml = [
    "sentence-transformers>=5.0.0,<6.0.0",
]
openai = [
    "openai>=2.0.0,<3.0.0",
]
benchmarks = [
    "psutil>=5.9.0",
]
all = [
    "sentence-transformers>=5.0.0,<6.0.0",
    "openai>=2.0.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["toucandb*"]

[tool.setuptools.package-data]
toucandb = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=toucandb --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
